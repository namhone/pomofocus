<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Nền đen nhám tối giản với độ chuyển màu nhẹ tạo chiều sâu -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161618" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
  </defs>

  <!-- Khung nền bo góc (Squircle App Icon) -->
  <rect x="8" y="8" width="984" height="984" rx="232" ry="232" fill="url(#bgGradient)" />

  <!-- Nhóm biểu tượng đồng hồ chữ P -->
  <g fill="#FFFFFF">
    <!-- Nút bấm trên đỉnh đồng hồ (Crown) -->
    <rect x="440" y="143" width="120" height="56" rx="16" ry="16" />
    <!-- Cổ nối nút bấm -->
    <rect x="473" y="190" width="54" height="50" />

    <!-- Chân chữ P (Nét sổ dọc bên trái) -->
    <rect x="283.5" y="650" width="54" height="202" />

    <!-- Vòng tròn thân đồng hồ (Bụng chữ P) -->
    <circle cx="500" cy="498" r="243" fill="none" stroke="#FFFFFF" stroke-width="54" />

    <!-- 4 vạch chỉ giờ (12h, 6h, 9h, 3h) -->
    <!-- Vạch 12 giờ -->
    <rect x="491" y="302" width="18" height="48" rx="9" ry="9" />
    <!-- Vạch 6 giờ -->
    <rect x="491" y="648" width="18" height="48" rx="9" ry="9" />
    <!-- Vạch 9 giờ -->
    <rect x="304" y="489" width="48" height="18" rx="9" ry="9" />
    <!-- Vạch 3 giờ -->
    <rect x="648" y="489" width="48" height="18" rx="9" ry="9" />
  </g>

  <!-- Kim đồng hồ và trục giữa -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <!-- Kim ngắn (bên trái) -->
    <line x1="482" y1="485" x2="404" y2="428" stroke-width="18" />
    <!-- Kim dài (bên phải) -->
    <line x1="516" y1="483" x2="625" y2="381" stroke-width="15" />
    <!-- Trục tròn ở tâm -->
    <circle cx="500" cy="498" r="19.5" fill="#111113" stroke-width="18" />
  </g>
</svg>
